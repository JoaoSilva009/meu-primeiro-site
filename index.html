<!DOCTYPE html>
<html>
<head>
    <title>Labirinto Shooter</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial;
        }

        #player {
            width: 40px;
            height: 40px;
            background: cyan;
            position: absolute;
            left: 100px;
            top: 100px;
            border-radius: 8px;
        }

        .enemy {
            width: 35px;
            height: 35px;
            background: red;
            position: absolute;
            border-radius: 8px;
        }

        .bullet {
            width: 10px;
            height: 10px;
            background: yellow;
            position: absolute;
            border-radius: 50%;
        }

        .wall {
            position: absolute;
            background: gray;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
        }

        #life {
            position: fixed;
            top: 45px;
            left: 10px;
            color: white;
            font-size: 24px;
        }

        #gameover {
            position: fixed;
            top: 40%;
            width: 100%;
            text-align: center;
            color: red;
            font-size: 60px;
            display: none;
        }

    </style>
</head>

<body>

    <div id="score">Pontos: 0</div>
    <div id="life">Vida: 5</div>
    <div id="gameover">GAME OVER</div>

    <div id="player"></div>

    <!-- PAREDES -->
    <div class="wall" style="width:300px;height:20px;top:200px;left:200px;"></div>
    <div class="wall" style="width:20px;height:250px;top:200px;left:500px;"></div>
    <div class="wall" style="width:250px;height:20px;top:450px;left:250px;"></div>

    <script>

        const player = document.getElementById("player");

        let x = 100;
        let y = 100;

        let score = 0;
        let life = 5;

        let enemies = [];
        let bullets = [];

        // Movimento
        document.addEventListener("keydown", (event) => {

            if(event.key === "w") y -= 15;
            if(event.key === "s") y += 15;
            if(event.key === "a") x -= 15;
            if(event.key === "d") x += 15;

            player.style.left = x + "px";
            player.style.top = y + "px";

            // TIRO
            if(event.key === " ") {

                createBullet();

            }

        });

        // Criar tiro
        function createBullet() {

            const bullet = document.createElement("div");

            bullet.classList.add("bullet");

            bullet.style.left = (x + 15) + "px";
            bullet.style.top = (y + 15) + "px";

            document.body.appendChild(bullet);

            bullets.push({
                element: bullet,
                x: x + 15,
                y: y + 15
            });

        }

        // Movimento do tiro
        function moveBullets() {

            bullets.forEach((bullet, index) => {

                bullet.x += 10;

                bullet.element.style.left = bullet.x + "px";

                // Colisão com inimigos
                enemies.forEach((enemy, enemyIndex) => {

                    if(
                        Math.abs(bullet.x - enemy.x) < 30 &&
                        Math.abs(bullet.y - enemy.y) < 30
                    ) {

                        enemy.element.remove();
                        bullet.element.remove();

                        enemies.splice(enemyIndex, 1);
                        bullets.splice(index, 1);

                        score++;

                        document.getElementById("score").innerText =
                            "Pontos: " + score;

                    }

                });

            });

        }

        // Criar inimigos
        function createEnemy() {

            const enemy = document.createElement("div");

            enemy.classList.add("enemy");

            let enemyX = Math.random() * window.innerWidth;
            let enemyY = Math.random() * window.innerHeight;

            enemy.style.left = enemyX + "px";
            enemy.style.top = enemyY + "px";

            document.body.appendChild(enemy);

            enemies.push({
                element: enemy,
                x: enemyX,
                y: enemyY
            });

        }

        // Movimento dos inimigos
        function moveEnemies() {

            enemies.forEach((enemy, index) => {

                if(enemy.x < x) enemy.x += 1;
                if(enemy.x > x) enemy.x -= 1;

                if(enemy.y < y) enemy.y += 1;
                if(enemy.y > y) enemy.y -= 1;

                enemy.element.style.left = enemy.x + "px";
                enemy.element.style.top = enemy.y + "px";

                // Colisão jogador
                if(
                    Math.abs(enemy.x - x) < 35 &&
                    Math.abs(enemy.y - y) < 35
                ) {

                    enemy.element.remove();

                    enemies.splice(index, 1);

                    life--;

                    document.getElementById("life").innerText =
                        "Vida: " + life;

                    if(life <= 0) {

                        document.getElementById("gameover").style.display = "block";

                    }

                }

            });

        }

        // Spawn inimigos
        setInterval(createEnemy, 2000);

        // Atualizações
        setInterval(moveEnemies, 20);
        setInterval(moveBullets, 20);

    </script>

</body>
</html>
