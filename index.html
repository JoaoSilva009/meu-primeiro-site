<!DOCTYPE html>
<html>
<head>
    <title>Jogo de Tiro</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial;
            color: white;
        }

        #player {
            width: 50px;
            height: 50px;
            background: blue;
            position: absolute;
            left: 100px;
            top: 100px;
        }

        .enemy {
            width: 40px;
            height: 40px;
            background: red;
            position: absolute;
            cursor: pointer;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div id="score">Pontos: 0</div>

    <div id="player"></div>

    <script>

        let score = 0;

        const player = document.getElementById("player");

        let x = 100;
        let y = 100;

        // Movimento do jogador
        document.addEventListener("keydown", (event) => {

            if(event.key === "w") y -= 10;
            if(event.key === "s") y += 10;
            if(event.key === "a") x -= 10;
            if(event.key === "d") x += 10;

            player.style.left = x + "px";
            player.style.top = y + "px";

        });

        // Criar inimigos
        function createEnemy() {

            const enemy = document.createElement("div");

            enemy.classList.add("enemy");

            enemy.style.left = Math.random() * window.innerWidth + "px";
            enemy.style.top = Math.random() * window.innerHeight + "px";

            document.body.appendChild(enemy);

            // Destruir inimigo
            enemy.addEventListener("click", () => {

                enemy.remove();

                score++;

                document.getElementById("score").innerText =
                    "Pontos: " + score;

            });

        }

        // Criar vários inimigos
        setInterval(createEnemy, 1000);

    </script>

</body>
</html>
