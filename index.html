<!DOCTYPE html>
<html>
<head>
    <title>Shooter Boss Fight</title>

    <style>

        body{
            margin:0;
            overflow:hidden;
            background:#111;
            cursor:crosshair;
            font-family:Arial;
        }

        #player{
            width:40px;
            height:40px;
            background:cyan;
            position:absolute;
            left:100px;
            top:100px;
            border-radius:8px;
        }

        .enemy{
            width:35px;
            height:35px;
            background:red;
            position:absolute;
            border-radius:8px;
        }

        #boss{
            width:120px;
            height:120px;
            background:purple;
            position:absolute;
            left:900px;
            top:300px;
            border-radius:20px;
        }

        .bullet{
            width:12px;
            height:12px;
            background:yellow;
            position:absolute;
            border-radius:50%;
        }

        .explosion{
            width:40px;
            height:40px;
            background:orange;
            position:absolute;
            border-radius:50%;
        }

        #score{
            position:fixed;
            top:10px;
            left:10px;
            color:white;
            font-size:24px;
        }

        #life{
            position:fixed;
            top:45px;
            left:10px;
            color:white;
            font-size:24px;
        }

        #bosslife{
            position:fixed;
            top:80px;
            left:10px;
            color:violet;
            font-size:24px;
        }

        #gameover{
            position:fixed;
            top:40%;
            width:100%;
            text-align:center;
            color:red;
            font-size:60px;
            display:none;
        }

    </style>
</head>

<body>

<div id="score">Pontos: 0</div>
<div id="life">Vida: 5</div>
<div id="bosslife">Boss Vida: 20</div>

<div id="gameover">GAME OVER</div>

<div id="player"></div>

<div id="boss"></div>

<script>

let player = document.getElementById("player");
let boss = document.getElementById("boss");

let x = 100;
let y = 100;

let score = 0;
let life = 5;
let bossLife = 20;

let bullets = [];
let enemies = [];

let mouseX = 0;
let mouseY = 0;

document.addEventListener("mousemove",(event)=>{

    mouseX = event.clientX;
    mouseY = event.clientY;

});

// MOVIMENTO
document.addEventListener("keydown",(event)=>{

    if(event.key==="w") y -= 15;
    if(event.key==="s") y += 15;
    if(event.key==="a") x -= 15;
    if(event.key==="d") x += 15;

    player.style.left = x + "px";
    player.style.top = y + "px";

});

// TIRO COM MOUSE
document.addEventListener("click",()=>{

    createBullet();

});

// CRIAR TIRO
function createBullet(){

    let bullet = document.createElement("div");

    bullet.classList.add("bullet");

    bullet.style.left = (x+15)+"px";
    bullet.style.top = (y+15)+"px";

    document.body.appendChild(bullet);

    let angle = Math.atan2(mouseY - y, mouseX - x);

    bullets.push({
        element: bullet,
        x: x+15,
        y: y+15,
        dx: Math.cos(angle)*10,
        dy: Math.sin(angle)*10
    });

}

// MOVER TIROS
function moveBullets(){

    bullets.forEach((bullet,index)=>{

        bullet.x += bullet.dx;
        bullet.y += bullet.dy;

        bullet.element.style.left = bullet.x + "px";
        bullet.element.style.top = bullet.y + "px";

        // COLISÃO BOSS
        let bossX = parseInt(boss.style.left);
        let bossY = parseInt(boss.style.top);

        if(
            bullet.x > bossX &&
            bullet.x < bossX + 120 &&
            bullet.y > bossY &&
            bullet.y < bossY + 120
        ){

            bullet.element.remove();
            bullets.splice(index,1);

            bossLife--;

            document.getElementById("bosslife").innerText =
                "Boss Vida: " + bossLife;

            createExplosion(bossX+40,bossY+40);

            if(bossLife <= 0){

                boss.remove();

                score += 50;

                document.getElementById("score").innerText =
                    "Pontos: " + score;

            }

        }

    });

}

// EXPLOSÃO
function createExplosion(ex,ey){

    let explosion = document.createElement("div");

    explosion.classList.add("explosion");

    explosion.style.left = ex + "px";
    explosion.style.top = ey + "px";

    document.body.appendChild(explosion);

    setTimeout(()=>{

        explosion.remove();

    },200);

}

// CRIAR INIMIGOS
function createEnemy(){

    let enemy = document.createElement("div");

    enemy.classList.add("enemy");

    let ex = Math.random()*window.innerWidth;
    let ey = Math.random()*window.innerHeight;

    enemy.style.left = ex + "px";
    enemy.style.top = ey + "px";

    document.body.appendChild(enemy);

    enemies.push({
        element: enemy,
        x: ex,
        y: ey
    });

}

// MOVER INIMIGOS
function moveEnemies(){

    enemies.forEach((enemy,index)=>{

        if(enemy.x < x) enemy.x += 1;
        if(enemy.x > x) enemy.x -= 1;

        if(enemy.y < y) enemy.y += 1;
        if(enemy.y > y) enemy.y -= 1;

        enemy.element.style.left = enemy.x + "px";
        enemy.element.style.top = enemy.y + "px";

        // COLISÃO PLAYER
        if(
            Math.abs(enemy.x - x) < 35 &&
            Math.abs(enemy.y - y) < 35
        ){

            enemy.element.remove();

            enemies.splice(index,1);

            life--;

            document.getElementById("life").innerText =
                "Vida: " + life;

            if(life <= 0){

                document.getElementById("gameover").style.display =
                    "block";

            }

        }

    });

}

setInterval(createEnemy,2000);

setInterval(moveEnemies,20);

setInterval(moveBullets,20);

</script>

</body>
</html>
