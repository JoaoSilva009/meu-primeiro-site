<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPA Mentor AI</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
}

header{
    text-align:center;
    padding:30px;
    background:#1e293b;
}

h1{
    margin:0;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    border-radius:10px;
    padding:10px;
    font-size:16px;
}

button{
    margin-top:10px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#22c55e;
    color:white;
    font-size:16px;
}

#resposta{
    margin-top:20px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
}

</style>
</head>
<body>

<header>
    <h1>CPA Mentor AI</h1>
    <p>Seu assistente para estudar CPA-20</p>
</header>

<div class="container">

    <h2>Faça uma pergunta:</h2>

    <textarea id="pergunta"
    placeholder="Ex: O que é um fundo de investimento?"></textarea>

    <br>

    <button onclick="responder()">
        Perguntar
    </button>

    <div id="resposta">
        Digite uma pergunta sobre CPA-20.
    </div>

</div>

<script>

function responder(){

    let pergunta =
    document.getElementById("pergunta")
    .value
    .toLowerCase();

    let resposta = "";

    if(pergunta.includes("fundo")){

        resposta =
        "Um fundo de investimento reúne recursos de diversos investidores para aplicação em ativos financeiros administrados por um gestor.";

    }

    else if(pergunta.includes("risco")){

        resposta =
        "Risco é a possibilidade de perda financeira. Na CPA-20 os principais riscos são mercado, crédito, liquidez e operacional.";

    }

    else if(pergunta.includes("tesouro")){

        resposta =
        "Tesouro Direto é um programa que permite investir em títulos públicos federais.";

    }

    else if(pergunta.includes("cdb")){

        resposta =
        "CDB é um título emitido por bancos para captação de recursos. Possui cobertura do FGC dentro dos limites estabelecidos.";

    }

    else if(pergunta.includes("fgc")){

        resposta =
        "FGC significa Fundo Garantidor de Créditos. Protege determinados investimentos até os limites vigentes.";

    }

    else{

        resposta =
        "Ainda não conheço esse tema. Você pode adicionar novos assuntos diretamente no código.";

    }

    document.getElementById("resposta")
    .innerHTML = resposta;

}

</script>

</body>
</html>
